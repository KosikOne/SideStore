name: Cellular SideStore Build

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: cellular-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: Nightly
      CHANNEL: nightly
      UPSTREAM_CHANNEL: ""

    steps:
      # codice SEMPRE fresco da upstream: nessuna sincronizzazione del fork
      # submodules: false -> li inizializziamo noi sotto, con fallback tollerante
      - uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: develop
          submodules: false
          fetch-depth: 0

      # upstream a volte forza-pusha/rebasa un sottomodulo (es. SideSign durante
      # il refactor altsign->sidesign) e il commit pinnato nel superprogetto sparisce:
      # "actions/checkout" con submodules:recursive fallirebbe DURO al checkout
      # stesso, senza artifact. Qui inizializziamo ogni submodule al pin esatto;
      # solo se il pin è irraggiungibile, fallback alla punta del branch dichiarato
      # in .gitmodules. A monte sistemato, questo step si limita al pin esatto.
      - name: Ripara i submodule spariti da upstream
        run: |
          python3 - <<'PY'
          import subprocess, re

          out = subprocess.run(['git', 'config', '-f', '.gitmodules', '--get-regexp', '.'],
                                capture_output=True, text=True).stdout
          subs = {}
          for line in out.splitlines():
              key, val = line.split(' ', 1)
              m = re.match(r'submodule\.(.+)\.(path|url|branch)$', key)
              if not m:
                  continue
              name, field = m.groups()
              subs.setdefault(name, {})[field] = val

          status = subprocess.run(['git', 'submodule', 'status'], capture_output=True, text=True).stdout
          for line in status.splitlines():
              parts = line.strip().split()
              if not parts:
                  continue
              sha, path = parts[0].lstrip('-+U'), parts[1]
              name = next(n for n, s in subs.items() if s.get('path') == path)
              branch = subs[name].get('branch', 'main')

              r = subprocess.run(['git', 'submodule', 'update', '--init', path], capture_output=True, text=True)
              if r.returncode == 0:
                  print(f"OK pin esatto: {path} @ {sha[:8]}")
              else:
                  print(f"pin sparito per {path} ({sha[:8]}): {r.stderr.strip().splitlines()[-1] if r.stderr.strip() else '??'}")
                  print(f"fallback -> tip di '{branch}' su {path}")
                  subprocess.run(['git', '-C', path, 'fetch', '--depth', '1', 'origin', branch], check=True)
                  subprocess.run(['git', '-C', path, 'checkout', 'FETCH_HEAD'], check=True)
                  newsha = subprocess.run(['git', '-C', path, 'rev-parse', 'HEAD'], capture_output=True, text=True).stdout.strip()
                  print(f"  -> {path} ora a {newsha[:8]} (tip di {branch})")

              # nipoti: init ricorsivo SOLO dentro il submodule già risolto,
              # cosi' non si tocca/reimposta il pin del padre.
              subprocess.run(['git', 'submodule', 'update', '--init', '--recursive'], cwd=path, check=False)

          print("submodule repair: done")
          PY

      - name: Patch minimuxer (allow cellular via utun)
        run: |
          FILE=Dependencies/minimuxer/Sources/MinimuxerImpl.swift
          python3 - "$FILE" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          # gate di rete, tollerante a spazi e al ricevente (Minimuxer. / self. / ...)
          pat = re.compile(r'(?P<recv>[A-Za-z_][\w.]*)\.network\.isWifiSatisfied(?P<ws>[ \t]*)/\* \|\|')
          n = len(pat.findall(s))
          if n != 1:
              sys.exit(f'PATCH FAILED - trovate {n} occorrenze del gate isWifiSatisfied (attesa 1): upstream cambiato')
          m = pat.search(s)
          recv, ws = m.group('recv'), m.group('ws')
          rep = f'{recv}.network.isWifiSatisfied || {recv}.network.isUTunAvailable{ws}/* ||'
          open(p, 'w', encoding='utf-8').write(s[:m.start()] + rep + s[m.end():])
          print('patched ->', rep)
          PY
          grep -n "isUTunAvailable" "$FILE" | head -3
          echo 'minimuxer patched OK'

      # bug upstream (github SideStore/SideStore #822/#851): il self-refresh di
      # SideStore, quando le notifiche non sono autorizzate, mostra un alert
      # "Finish Refresh" con un solo bottone "Continue" e ASPETTA il tap per
      # sempre. Via Shortcuts/automazione headless non lo tocca nessuno: il
      # refresh di SideStore stesso resta appeso in loop infinito (le altre app
      # nel frattempo si rinnovano regolarmente). Qui si salta l'alert e si
      # sospende sempre l'app da soli, come già succede quando le notifiche
      # SONO autorizzate (stesso identico suspendToHomeScreen()).
      - name: Patch self-refresh (evita l'alert 'Finish Refresh' che blocca l'automazione headless)
        run: |
          FILE=SideStore/Core/Operations/PipelineOperations/InstallAppOperation.swift
          python3 - "$FILE" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          pat = re.compile(r'handler\.requestBackgroundSuspension\s*\{\s*self\.suspendToHomeScreen\(\)\s*\}')
          n = len(pat.findall(s))
          if n != 2:
              sys.exit(f'PATCH FAILED - trovate {n} occorrenze (attese 2): upstream cambiato')
          s2 = pat.sub('self.suspendToHomeScreen()', s)
          open(p, 'w', encoding='utf-8').write(s2)
          print(f'patchate {n} occorrenze -> self.suspendToHomeScreen() diretto')
          PY
          echo 'self-refresh headless patched OK'

      # upstream ogni tanto congela in Package.resolved una revisione che poi
      # sparisce dal repo della dipendenza (force-push / branch cancellato):
      # xcodebuild muore con "Could not resolve package dependencies".
      # Qui togliamo SOLO i pin irraggiungibili: SPM li ri-risolve dal branch
      # o dalla versione dichiarati. A monte sistemato, questo step non fa nulla.
      - name: Ripara i pin SPM spariti da upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          p = 'AltStore.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          d = json.load(open(p, encoding='utf-8'))
          tok = os.environ.get('GH_TOKEN', '')
          tenuti, tolti = [], []
          for pin in d.get('pins', []):
              loc = pin.get('location', '')
              rev = (pin.get('state') or {}).get('revision')
              m = re.match(r'https://github\.com/([^/]+)/([^/]+?)(?:\.git)?$', loc)
              if not m or not rev:
                  tenuti.append(pin)
                  continue
              url = f'https://api.github.com/repos/{m.group(1)}/{m.group(2)}/commits/{rev}'
              hdr = {'Accept': 'application/vnd.github+json',
                     'User-Agent': 'cellular-build'}
              if tok:
                  hdr['Authorization'] = f'Bearer {tok}'
              req = urllib.request.Request(url, headers=hdr)
              try:
                  urllib.request.urlopen(req, timeout=30).read(1)
                  tenuti.append(pin)
              except urllib.error.HTTPError as e:
                  if e.code in (404, 422):
                      print(f'pin sparito: {pin["identity"]} {rev[:10]} (HTTP {e.code})')
                      tolti.append(pin)
                  else:
                      print(f'controllo non concluso ({e.code}), tengo {pin["identity"]}')
                      tenuti.append(pin)
              except Exception as e:
                  print(f'controllo non concluso ({e}), tengo {pin["identity"]}')
                  tenuti.append(pin)
          if tolti:
              d['pins'] = tenuti
              json.dump(d, open(p, 'w', encoding='utf-8'), indent=2)
              print('rimossi:', [x['identity'] for x in tolti])
          else:
              print('tutti i pin sono raggiungibili, niente da fare')
          PY

      - run: brew install ldid xcbeautify

      # --------------------------------------------------
      # runtime env setup
      # --------------------------------------------------
      - name: Setup Env
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)

          NORMALIZED_VERSION=$(python3 scripts/ci/workflow.py compute-normalized \
              "$MARKETING_VERSION" \
              "$BUILD_NUM" \
              "$SHORT_COMMIT")

          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"

          echo "BUILD_NUM=$BUILD_NUM" | tee -a $GITHUB_ENV
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Restore Cache (exact)
        id: xcode-cache-exact
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-${{ github.ref_name }}-${{ github.sha }}

      - name: Restore Cache (last)
        if: >
          steps.xcode-cache-exact.outputs.cache-hit != 'true'
        id: xcode-cache-fallback
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-${{ github.ref_name }}-

      # --------------------------------------------------
      # build and test
      # --------------------------------------------------
      - name: Build
        id: build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-build
          echo "encrypted=true" >> $GITHUB_OUTPUT
          exit $STATUS

      - name: Save Cache
        if: >
          steps.xcode-cache-fallback.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-${{ github.ref_name }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.MARKETING_VERSION }}.zip
          path: build-logs.zip

      - uses: actions/upload-artifact@v4
        if: >
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_BUILD == '1'
        with:
          name: tests-build-logs-${{ env.SHORT_COMMIT }}.zip
          path: tests-build-logs.zip

      - uses: actions/upload-artifact@v4
        if: >
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        with:
          name: tests-run-logs-${{ env.SHORT_COMMIT }}.zip
          path: tests-run-logs.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}.ipa
          path: SideStore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}-dSYMs.zip
          path: SideStore.dSYMs.zip
